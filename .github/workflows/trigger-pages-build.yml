name: Trigger GitHub Pages Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  trigger-pages-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${{ github.repository }}/pages/builds"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body -sS -L -X POST "${headers[@]}" "$api"
          echo

          for attempt in $(seq 1 48); do
            response="$(curl --fail-with-body -sS -L "${headers[@]}" "$api/latest")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))' <<< "$response")"
            commit="$(python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' <<< "$response")"
            echo "Pages build attempt $attempt: status=$status commit=$commit"

            if [ "$status" = "built" ]; then
              echo "GitHub Pages build completed for commit $commit."
              exit 0
            fi

            if [ "$status" = "errored" ]; then
              echo "$response"
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for GitHub Pages build."
          exit 1
