name: Validate SiteOrders

on:
  push:
    branches:
      - feature/order-workflow-v2
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Test material image preview regression
        run: node tests/image-preview-regression.js
